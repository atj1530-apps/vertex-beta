<script>
// ============================================================
// STRAVA INTEGRATION
// ============================================================
const STRAVA_CLIENT_ID = '250525';
const STRAVA_REDIRECT_URI = 'https://vertex-beta-five.vercel.app';
const STRAVA_SCOPE = 'read,activity:read_all';

function stravaGetToken() {
  try { return JSON.parse(localStorage.getItem('vertex_strava_token') || 'null'); } catch(e) { return null; }
}
function stravaSetToken(t) {
  try { localStorage.setItem('vertex_strava_token', JSON.stringify(t)); } catch(e) {}
}
function stravaClearToken() {
  try { localStorage.removeItem('vertex_strava_token'); } catch(e) {}
}
function stravaIsConnected() {
  const t = stravaGetToken();
  return !!(t && t.access_token);
}

function stravaConnect() {
  const url = `https://www.strava.com/oauth/authorize?client_id=${STRAVA_CLIENT_ID}&redirect_uri=${encodeURIComponent(STRAVA_REDIRECT_URI)}&response_type=code&approval_prompt=auto&scope=${STRAVA_SCOPE}&state=strava_oauth`;
  window.location.href = url;
}

async function stravaExchangeCode(code) {
  const r = await fetch('/api/strava-auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code, grant_type: 'authorization_code' })
  });
  if (!r.ok) throw new Error('Token exchange failed');
  return r.json();
}

async function stravaRefreshToken() {
  const t = stravaGetToken();
  if (!t || !t.refresh_token) return null;
  if (Date.now() / 1000 < t.expires_at - 300) return t.access_token;
  const r = await fetch('/api/strava-auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ grant_type: 'refresh_token', refresh_token: t.refresh_token })
  });
  if (!r.ok) { stravaClearToken(); return null; }
  const data = await r.json();
  stravaSetToken(data);
  return data.access_token;
}

async function stravaFetchActivities(accessToken, perPage = 30) {
  const after = Math.floor(Date.now() / 1000) - (90 * 24 * 60 * 60);
  const r = await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=${perPage}&after=${after}`, {
    headers: { 'Authorization': `Bearer ${accessToken}` }
  });
  if (!r.ok) throw new Error('Failed to fetch activities');
  return r.json();
}

function stravaActivityToLog(activity, userId) {
  const typeMap = { 'Run': 'cardio', 'Ride': 'cardio', 'Swim': 'cardio', 'WeightTraining': 'strength', 'Workout': 'strength', 'Walk': 'cardio', 'Hike': 'cardio', 'Yoga': 'flexibility', 'CrossFit': 'strength' };
  return {
    user_id: userId,
    logged_at: activity.start_date,
    workout_name: activity.name || activity.type,
    workout_type: typeMap[activity.type] || 'cardio',
    duration_min: Math.round((activity.moving_time || 0) / 60),
    notes: `Strava · ${activity.type}${activity.distance ? ' · ' + (activity.distance / 1000).toFixed(1) + 'km' : ''}`,
    source: 'strava',
    strava_id: String(activity.id)
  };
}

async function stravaSyncActivities() {
  if (!authUser) return;
  const accessToken = await stravaRefreshToken();
  if (!accessToken) return;
  try {
    const activities = await stravaFetchActivities(accessToken);
    if (!activities || !activities.length) return;
    const supa = getSupa();
    const { data: existing } = await supa.from('vertex_workout_logs').select('strava_id').eq('user_id', authUser.id).not('strava_id', 'is', null);
    const existingIds = new Set((existing || []).map(r => r.strava_id));
    const newLogs = activities.filter(a => !existingIds.has(String(a.id))).map(a => stravaActivityToLog(a, authUser.id));
    if (newLogs.length) {
      await supa.from('vertex_workout_logs').insert(newLogs);
      toast(`Strava: ${newLogs.length} new activit${newLogs.length === 1 ? 'y' : 'ies'} synced`);
    }
  } catch(e) {
    console.warn('Strava sync error:', e);
  }
}

function stravaUpdateSettingsUI() {
  const btn = document.getElementById('btn-strava-connect');
  const status = document.getElementById('strava-status-text');
  if (!btn || !status) return;
  if (stravaIsConnected()) {
    const t = stravaGetToken();
    btn.textContent = 'DISCONNECT';
    btn.classList.remove('acc');
    btn.style.color = 'var(--red)';
    btn.style.borderColor = 'rgba(255,77,77,.4)';
    status.textContent = t?.athlete?.firstname ? `Connected as ${t.athlete.firstname} ${t.athlete.lastname || ''}`.trim() : '● Connected';
    status.style.color = 'var(--green)';
  } else {
    btn.textContent = 'CONNECT';
    btn.classList.add('acc');
    btn.style.color = '';
    btn.style.borderColor = '';
    status.textContent = 'Not connected';
    status.style.color = 'var(--muted)';
  }
}

// Handle Strava OAuth callback
(async function stravaHandleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  if (code && state === 'strava_oauth') {
    history.replaceState({}, '', window.location.pathname);
    try {
      const token = await stravaExchangeCode(code);
      stravaSetToken(token);
      toast('Strava connected!');
      stravaUpdateSettingsUI();
      if (authUser) await stravaSyncActivities();
    } catch(e) {
      toast('Strava connection failed');
      console.error(e);
    }
  }
})();

// Wire up connect/disconnect button
document.addEventListener('click', async function(e) {
  if (e.target.id !== 'btn-strava-connect') return;
  if (stravaIsConnected()) {
    if (await vertexConfirm('Disconnect Strava? Your synced activities will remain.')) {
      stravaClearToken();
      stravaUpdateSettingsUI();
      toast('Strava disconnected');
    }
  } else {
    stravaConnect();
  }
});

// Update UI when settings modal opens
const _origOpenSettings = window.openSettingsModal;
window.openSettingsModal = function() {
  if (typeof _origOpenSettings === 'function') _origOpenSettings();
  setTimeout(stravaUpdateSettingsUI, 50);
};

// Auto-sync on login
window.addEventListener('vertex-auth-ready', async function() {
  if (stravaIsConnected()) await stravaSyncActivities();
}, { once: true });
</script>


<script id="vertex-phase1f-stability-tabs-dots-coachfeed">
(function(){
  'use strict';
  if(window.__vertexPhase1FStabilityPatch) return;
  window.__vertexPhase1FStabilityPatch = true;

  function esc(v){
    try{ if(typeof escapeHtml==='function') return escapeHtml(String(v==null?'':v)); }catch(e){}
    return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});
  }
  function getRows(){ try{return (typeof progressRows==='function'?progressRows():[])||[];}catch(e){return [];} }
  function getSummary(rows){ try{return (typeof progressSummary==='function'?progressSummary(rows):{})||{};}catch(e){return {};} }
  function getPerf(rows){ try{return (typeof performanceSummary==='function'?performanceSummary(rows):[])||[];}catch(e){return [];} }
  function week0(){ try{return typeof weekStart==='function'?weekStart():new Date();}catch(e){return new Date();} }

  function lockProgressArchitecture(){
    try{
      var page=document.getElementById('progressPage'); if(!page) return;
      var head=page.querySelector('.progress-head');
      var tabs=page.querySelector('.progress-tabs');
      var content=document.getElementById('progressTabContent');
      var deck=document.getElementById('vertexB2ProgressDeck');
      var overview=document.getElementById('ptab-overview');
      var overviewLayout=overview && overview.querySelector('.progress-layout');
      if(head && tabs && head.nextElementSibling!==tabs){ head.insertAdjacentElement('afterend', tabs); }
      if(overview && deck && deck.parentElement!==overview){
        if(overview.firstElementChild) overview.insertBefore(deck, overview.firstElementChild);
        else overview.appendChild(deck);
      }
      if(tabs && content && tabs.nextElementSibling!==content){ tabs.insertAdjacentElement('afterend', content); }
      if(page.classList) page.classList.add('vertex-phase1f-progress-locked');
      if(overviewLayout) overviewLayout.classList.add('vertex-overview-interpretation');
      var current='overview';
      var on=tabs && tabs.querySelector('.progress-tab.on');
      if(on) current=on.getAttribute('data-ptab')||'overview';
      ['overview','volume','exercises','history'].forEach(function(t){
        var el=document.getElementById('ptab-'+t); if(el) el.style.display=(t===current?'block':'none');
      });
    }catch(e){ console.warn('[Vertex Phase1F] progress architecture lock failed',e); }
  }

  function buildCoachFeed(rows,sum,perf){
    var cards=[];
    var sessions=sum.thisWeek?sum.thisWeek.length:0;
    var prev=sum.prevWeek?sum.prevWeek.length:0;
    var delta=sessions-prev;
    var daysSince=(sum.daysSince==null?null:sum.daysSince);
    var totals={};
    try{
      var start=week0();
      rows.filter(function(r){return new Date(r.completed_at)>=start;}).forEach(function(r){
        var muscles=(r.metrics&&r.metrics.muscles)||{};
        Object.keys(muscles).forEach(function(m){ totals[m]=(totals[m]||0)+((muscles[m]&&muscles[m].sets)||0); });
      });
    }catch(e){}
    var ranked=Object.keys(totals).map(function(k){return [k,totals[k]];}).sort(function(a,b){return b[1]-a[1];});
    var top=ranked[0], second=ranked[1];
    var topMove=perf && perf[0];
    function add(title,body,tone){ cards.push({title:title,body:body,tone:tone||''}); }
    if(!rows.length){
      add('Start the baseline','Log 3–4 workouts before Vertex makes stronger progression, recovery, and volume recommendations.','');
      return cards;
    }
    if(delta>0){ add('Protect the ramp-up','Consistency is improving versus last week. Keep load jumps conservative until recovery confirms you can absorb the added frequency.','green'); }
    else if(delta<0){ add('Rebuild rhythm','Training frequency dipped versus last week. Prioritize one short, high-quality session before chasing more volume.','warn'); }
    else { add('Hold the rhythm','Frequency is stable. Use the next session to improve execution quality or one priority lift, not every movement.',''); }
    if(top && second && top[1] >= Math.max(6, second[1]*1.45)){
      add('Balance the dominant muscle group', top[0]+' is pulling ahead this week. Add complementary work or keep the next '+top[0]+' session submaximal to avoid overloading one pattern.','warn');
    } else if(top){
      add('Volume is balanced enough to progress','No single muscle group is dramatically outpacing the rest. Progress one priority movement if warm-ups feel strong.','green');
    }
    if(topMove && topMove.sets>=8){
      add('Watch repeat-movement fatigue', topMove.name+' has high repeat exposure. If performance stalls, hold load and add reps only with clean form.','');
    }
    if(daysSince!==null){
      if(daysSince===0) add('Do not stack intensity blindly','You trained today. Treat any second session as technique, mobility, or low-strain conditioning.','warn');
      else if(daysSince>=4) add('Restart with control','It has been '+daysSince+' days since your last workout. Re-enter at moderate intensity before testing max effort.','warn');
      else add('Timing supports productive training','Last workout timing leaves room for a productive session if sleep, HRV, and warm-up quality are acceptable.','green');
    }
    return cards.slice(0,4);
  }

  function renderCoachFeedAndCompactWeeks(){
    try{
      var rows=getRows(), sum=getSummary(rows), perf=getPerf(rows);
      var insights=document.getElementById('progressInsights');
      if(insights){
        var feed=buildCoachFeed(rows,sum,perf);
        insights.innerHTML=feed.map(function(c){
          return '<div class="insight vertex-coach-feed-card '+(c.tone==='warn'?'coach-warning':c.tone==='green'?'coach-green':'')+'"><b>'+esc(c.title)+'</b><span>'+esc(c.body)+'</span></div>';
        }).join('');
      }
      var weeks=document.getElementById('progressWeeks');
      if(weeks){
        var starts=[0,1,2,3].map(function(i){var d=week0(); d.setDate(d.getDate()-(i*7)); return d;}).reverse();
        var data=starts.map(function(st,idx){
          var end=new Date(st); end.setDate(end.getDate()+7);
          var count=rows.filter(function(r){var dt=new Date(r.completed_at); return dt>=st && dt<end && r.workout_type!=='hk_dismissed' && r.workout_type!=='hk_imported_dismissed';}).length;
          return {label:'W'+(idx+1),date:st.toLocaleDateString([],{month:'short',day:'numeric'}),count:count};
        });
        var max=Math.max(1, ...data.map(function(w){return w.count;}));
        if(data.some(function(w){return w.count>0;})){
          weeks.innerHTML='<div class="vertex-week-compact">'+data.map(function(w){
            var pct=Math.max(8,Math.round((w.count/max)*100));
            return '<div class="vertex-week-pill" title="'+esc(w.date)+'"><div class="vertex-week-label">'+esc(w.label)+'</div><div class="vertex-week-bar"><span style="height:'+pct+'%"></span></div><div class="vertex-week-count">'+w.count+'</div></div>';
          }).join('')+'</div><div class="vertex-week-note">Mobile view is capped at the last 4 weeks.</div>';
        }else{
          weeks.innerHTML='<div class="empty-note">Log your first workout to see weekly consistency.</div>';
        }
      }
    }catch(e){ console.warn('[Vertex Phase1F] coach/weekly patch failed',e); }
  }

  function ensurePlannerDots(){
    try{
      var acc=document.getElementById('plannerAcc');
      var planner=document.getElementById('planner');
      if(!acc || !planner) return;
      var dots=document.getElementById('vertexPlannerDots');
      if(!dots){
        dots=document.createElement('div');
        dots.id='vertexPlannerDots';
        dots.className='vertex-planner-dots';
        dots.innerHTML=['M','T','W','Th','F','S','Su'].map(function(d,i){return '<span class="vertex-planner-dot" data-planner-dot="'+i+'">'+d+'</span>';}).join('');
        var body=acc.querySelector('.acc-body')||acc;
        body.appendChild(dots);
      }
      function update(){
        var cards=planner.querySelectorAll('.day-card');
        var idx=0;
        if(cards.length){
          var left=planner.scrollLeft||0;
          var best=Infinity;
          cards.forEach(function(card,i){
            var dist=Math.abs((card.offsetLeft||0)-left);
            if(dist<best){best=dist; idx=i;}
          });
        }
        dots.querySelectorAll('.vertex-planner-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
      }
      if(!planner.__vertexPlannerDotsBound){
        planner.__vertexPlannerDotsBound=true;
        var timer;
        planner.addEventListener('scroll',function(){ clearTimeout(timer); timer=setTimeout(update,60); },{passive:true});
        dots.addEventListener('click',function(e){
          var d=e.target.closest('[data-planner-dot]'); if(!d) return;
          var i=Number(d.getAttribute('data-planner-dot')||0);
          var card=planner.querySelectorAll('.day-card')[i];
          if(card) planner.scrollTo({left:card.offsetLeft,behavior:'smooth'});
          update();
        });
      }
      setTimeout(update,30); setTimeout(update,250);
    }catch(e){ console.warn('[Vertex Phase1F] planner dots failed',e); }
  }

  function applyAll(){
    lockProgressArchitecture();
    renderCoachFeedAndCompactWeeks();
    ensurePlannerDots();
  }

  var originalRender=window.renderProgressPage;
  if(typeof originalRender==='function' && !originalRender.__vertexPhase1FWrapped){
    var wrapped=function(){ var out=originalRender.apply(this,arguments); setTimeout(applyAll,0); return out; };
    wrapped.__vertexPhase1FWrapped=true;
    window.renderProgressPage=wrapped;
  }
  var originalSetTab=window.setProgressTab;
  if(typeof originalSetTab==='function' && !originalSetTab.__vertexPhase1FWrapped){
    var wrappedTab=function(tab){ var out=originalSetTab.apply(this,arguments); setTimeout(applyAll,0); return out; };
    wrappedTab.__vertexPhase1FWrapped=true;
    window.setProgressTab=wrappedTab;
  }
  document.addEventListener('click',function(e){ if(e.target && (e.target.closest('[data-ptab]') || e.target.closest('[data-nav]'))){ setTimeout(applyAll,80); setTimeout(applyAll,350); } },true);
  window.addEventListener('resize',function(){ setTimeout(ensurePlannerDots,100); });
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(applyAll,50); setTimeout(applyAll,500); });
  else { setTimeout(applyAll,50); setTimeout(applyAll,500); setTimeout(applyAll,1500); }
})();
</script>

<script id="vertex-phase2b-coach-intelligence">
(function(){
  'use strict';
  if(window.__vertexPhase2BCoachIntelligence) return;
  window.__vertexPhase2BCoachIntelligence = true;

  function esc(v){
    try{ if(typeof escapeHtml==='function') return escapeHtml(String(v==null?'':v)); }catch(e){}
    return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
  }
  function rows(){ try{return (typeof progressRows==='function'?progressRows():[])||[];}catch(e){return [];} }
  function summary(rs){ try{return (typeof progressSummary==='function'?progressSummary(rs):{})||{};}catch(e){return {};} }
  function perf(rs){ try{return (typeof performanceSummary==='function'?performanceSummary(rs):[])||[];}catch(e){return [];} }
  function weekStartSafe(){ try{return typeof weekStart==='function'?weekStart():new Date(Date.now()-7*86400000);}catch(e){return new Date(Date.now()-7*86400000);} }
  function n(v,d){ v=Number(v); return Number.isFinite(v)?v:(d==null?0:d); }
  function readiness(){
    try{ if(window.VertexReadiness && typeof window.VertexReadiness.cached==='function'){ var r=window.VertexReadiness.cached()||{}; if(Number.isFinite(Number(r.score))) return {score:Math.round(Number(r.score)),label:r.label||'',data:r}; } }catch(e){}
    try{ if(window.VertexRecoveryInsights && typeof window.VertexRecoveryInsights.build==='function'){ var x=window.VertexRecoveryInsights.build()||{}; if(Number.isFinite(Number(x.recovery))) return {score:Math.round(Number(x.recovery)),label:x.status||'',data:x}; } }catch(e){}
    return {score:null,label:'Pending',data:{}};
  }
  function strain(){
    try{ if(window.VertexTrainingStrainEngine && typeof window.VertexTrainingStrainEngine.build==='function'){ return window.VertexTrainingStrainEngine.build()||{}; } }catch(e){}
    return {};
  }
  function muscleTotals(rs,start,end){
    var out={};
    try{ rs.forEach(function(r){ var dt=new Date(r.completed_at||r.created_at||0); if(start&&dt<start) return; if(end&&dt>=end) return; var m=(r.metrics&&r.metrics.muscles)||{}; Object.keys(m).forEach(function(k){ out[k]=(out[k]||0)+n(m[k]&&m[k].sets,0); }); }); }catch(e){}
    return out;
  }
  function ranked(obj){ return Object.keys(obj||{}).map(function(k){return {name:k,sets:n(obj[k],0)};}).sort(function(a,b){return b.sets-a.sets;}); }
  function card(title, action, why, tone, tip, meta){
    return {title:title,action:action,why:why,tone:tone||'',tip:tip||'Vertex uses logged workouts, readiness, strain, and recent trends to make this recommendation.',meta:meta||''};
  }
  function build(){
    var rs=rows(), sum=summary(rs), pf=perf(rs), ready=readiness(), st=strain();
    var sessions=(sum.thisWeek&&sum.thisWeek.length)||0, prev=(sum.prevWeek&&sum.prevWeek.length)||0, delta=sessions-prev;
    var daysSince=(sum.daysSince==null?null:Number(sum.daysSince));

    var start=weekStartSafe(), prior=new Date(start); prior.setDate(prior.getDate()-7);
    var top=ranked(muscleTotals(rs,start))[0]||null, second=ranked(muscleTotals(rs,start))[1]||null;
    var topMove=pf&&pf[0];
    var out=[];
    if(!rs.length){
      return [card('Build the baseline','Log 3–4 workouts so Vertex can learn your normal rhythm.','After a few sessions, Vertex can spot what is normal for you and make better coaching calls.','','Why Vertex needs a baseline','Phase 2B')];
    }
    if(score!==null && score<60){
      out.push(card('Recovery-first day','Keep today lighter: technique work, mobility, or controlled volume.','Recovery looks low, so the win today is staying consistent without forcing a hard session.','warn','Readiness tells Vertex how much room you likely have to train hard today.', 'Readiness '+score));
    } else if(score!==null && score>=75 && strainScore<70){
      out.push(card('Good window to build','Progress one priority lift or add one quality set — not everything at once.','Recovery looks supportive, but the smartest move is a targeted push instead of adding volume everywhere.','green','Vertex shows this when your recovery looks strong enough for a smart push.', 'Readiness '+score));
    } else {
      out.push(card('Controlled training day','Train as planned, but keep reps clean and stop before form breaks down.','Your signals support training, but not an all-out day across every movement.','','Vertex weighs recovery, workload, and recent training before suggesting how hard to push.', score!==null?'Readiness '+score:'Readiness pending'));

    } else if(delta<0){
      out.push(card('Rhythm rebuild','Get one clean session in before adding more volume.','Training rhythm dipped, so rebuild consistency first before chasing heavier work.','warn','Compares current weekly frequency against the prior week.', sessions+' vs '+prev+' sessions'));
    } else {
      out.push(card('Stable rhythm','Use the next session to sharpen form or progress one key lift.','Your rhythm is steady, so progress can come from better reps — not just more work.','green','Stable rhythm means weekly frequency is holding.', sessions+' sessions this week'));
    }
    if(top && second && top.sets>=Math.max(6,second.sets*1.45)){
      out.push(card('Imbalance detected','Balance '+top.name+' with complementary work or keep the next '+top.name+' block submaximal.','One muscle group is getting most of the work this week, which can create fatigue even if overall readiness looks fine.','warn','Flags when one muscle group is starting to pull ahead of the rest.', top.name+' '+top.sets+' sets'));
    } else if(top){
      out.push(card('Volume balance looks good','Progress one priority movement if warm-ups feel strong.','No single muscle group is taking over the week, so your training balance looks reasonable.','green','Reviews how your weekly sets are spread across muscle groups.', top.name+' leads'));
    }
    if(score!==null && strainScore>=70){
      out.push(card('Recovery and workload mismatch','Reduce intensity or trim hard sets in the next session.','Workload is running ahead of recovery. You may still feel okay, but fatigue can build underneath.','warn','Looks for signs that workload is getting ahead of recovery.', 'Strain '+Math.round(strainScore)));
    } else if(score!==null && score>=70 && load>0){
      out.push(card('Recovery is supporting output','Keep the session productive, but limit progression to one main target.','Recovery and recent output look aligned enough to train, but extra volume still needs to be earned.','green','Connects recovery status with recent training volume.', Math.round(load)+' load volume'));
    }
    if(topMove && n(topMove.sets,0)>=8){
      out.push(card('Repeat-movement fatigue watch','Hold load on '+topMove.name+' if speed or form drops.','Repeating the same movement often can create fatigue before your overall week looks heavy.','','Uses workout history to watch repeat exposure.', n(topMove.sets,0)+' tracked sets'));
    }
    if(daysSince!==null){
      if(daysSince===0) out.push(card('Same-day intensity cap','Keep any second session easy: conditioning, mobility, or skill work.','Stacking hard sessions in one day can add fatigue faster than it adds progress.','warn','Uses when your last workout was logged.', 'Trained today'));
      else if(daysSince>=4) out.push(card('Re-entry protocol','Start moderate and earn intensity during warm-up sets.','After several days off, ease back in before pushing hard.','warn','Uses days since your last logged workout.', daysSince+' days since last'));
    }
    return out.slice(0,5);
  }
  function render(){
    try{
      var el=document.getElementById('progressInsights'); if(!el) return false;
      var feed=build();
      el.innerHTML=feed.map(function(c){
        var cls=c.tone==='warn'?'coach-warning':(c.tone==='green'?'coach-green':'');
        return '<div class="insight vertex-coach-feed-card vertex-phase2b-card '+cls+'"><div class="vertex-phase2b-title"><b>'+esc(c.title)+'</b><button class="vertex-i" type="button" aria-label="Info" data-tip="'+esc(c.tip)+'">i</button></div><div class="vertex-phase2b-action">'+esc(c.action)+'</div><div class="vertex-phase2b-why">'+esc(c.why)+'</div>'+(c.meta?'<div class="vertex-phase2b-meta">'+esc(c.meta)+'</div>':'')+'</div>';
      }).join('');
      return true;
    }catch(e){ console.warn('[Vertex Phase2B] coach intelligence render failed', e); return false; }
  }
  var tips={
    'Recovery Trend':'Readiness direction based on recovery signals and recent training context.',
    'Load Tolerance':'How well current recovery appears able to absorb recent training load.',
    'Adaptive Coach':'A practical training recommendation based on readiness, strain, and consistency.',
    'Cardio Strain':'Recent endurance load from connected cardio data when available.',
    'Workout Memory':'Tracked exercise history used for repeat exposure and progression context.',
    'Weekly Intelligence':'This week’s training frequency compared with your recent baseline.',
    'Imbalance Detection':'Flags when one muscle group materially outpaces the rest of the current week.',
    'Consistency':'Whether your workout cadence is building, stable, or slipping.',
    'Longitudinal Trend':'Longer-term direction from repeated training and recovery signals.'
  };
  function addTooltips(){
    try{
      document.querySelectorAll('#vertexB2ProgressDeck .vertex-b2-card').forEach(function(cardEl){
        var label=cardEl.querySelector('.label'); if(!label || label.querySelector('.vertex-i')) return;
        var name=String(label.textContent||'').trim();
        var tip=tips[name]||'Vertex interprets this card from your logged training, recovery, and trend data.';
        var btn=document.createElement('button'); btn.type='button'; btn.className='vertex-i'; btn.setAttribute('aria-label','Info'); btn.setAttribute('data-tip',tip); btn.textContent='i';
        label.appendChild(btn);
      });
    }catch(e){}
  }
  function sync(){ render(); addTooltips(); }
  var oldRender=window.renderProgressPage;
  if(typeof oldRender==='function' && !oldRender.__vertexPhase2BWrapped){
    var wrapped=function(){ var out=oldRender.apply(this,arguments); setTimeout(sync,140); setTimeout(sync,520); return out; };
    wrapped.__vertexPhase2BWrapped=true;
    window.renderProgressPage=wrapped;
  }
  [160,650,1300,2600,4200].forEach(function(ms){ setTimeout(sync,ms); });
  document.addEventListener('click',function(e){ if(e.target && (e.target.closest('[data-ptab]') || e.target.closest('[data-nav]') || e.target.closest('#btn-refresh-progress'))){ setTimeout(sync,220); setTimeout(sync,700); } },true);
  try{ var mo=new MutationObserver(function(){ clearTimeout(window.__vertexPhase2BTimer); window.__vertexPhase2BTimer=setTimeout(addTooltips,120); }); document.addEventListener('DOMContentLoaded',function(){ if(document.body) mo.observe(document.body,{childList:true,subtree:true}); }); }catch(e){}
  window.VertexPhase2BCoachIntelligence={render:render,sync:sync,build:build};
})();
</script>

<script id="vertex-phase2d-adaptive-decision-engine">
(function(){
  if(window.__vertexPhase2D1AdaptiveDecision) return;
  window.__vertexPhase2D1AdaptiveDecision=true;
  function esc(v){
    try{ if(typeof escapeHtml==='function') return escapeHtml(String(v==null?'':v)); }catch(e){}
    return String(v==null?'':v).replace(/[&<>\"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m;});
  }
  function n(v,d){ v=Number(v); return Number.isFinite(v)?v:(d||0); }
  function rows(){ try{ return typeof progressRows==='function' ? (progressRows()||[]) : []; }catch(e){ return []; } }
  function sum(rs){ try{ return typeof progressSummary==='function' ? (progressSummary(rs)||{}) : {}; }catch(e){ return {}; } }
  function perf(rs){ try{ return typeof performanceSummary==='function' ? (performanceSummary(rs)||[]) : []; }catch(e){ return []; } }
  function ready(){
    try{
      if(window.VertexRecoveryInsights && typeof window.VertexRecoveryInsights.build==='function'){
        var r=window.VertexRecoveryInsights.build()||{};
        var val=n(r.recovery,NaN);
        if(Number.isFinite(val)) return Math.round(val);
      }
    }catch(e){}
    return null;
  }
  function weekStartSafe(){
    try{ if(typeof weekStart==='function') return weekStart(new Date()); }catch(e){}
    var d=new Date(); var day=d.getDay(); d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d;
  }
  function rowTime(r){
    try{ return new Date(r.completed_at||r.created_at||r.logged_at||r.date||0).getTime()||0; }catch(e){ return 0; }
  }
  function muscleKey(r){
    try{
      if(r.metrics && r.metrics.muscles){
        var ks=Object.keys(r.metrics.muscles||{}).sort(function(a,b){
          return n((r.metrics.muscles[b]||{}).sets,0)-n((r.metrics.muscles[a]||{}).sets,0);
        });
        if(ks[0]) return ks[0];
      }
    }catch(e){}
    return (r.muscle||r.primary_muscle||r.group||r.primaryMuscle||'General').toString();
  }
  function muscleTotals(rs,start){
    var out={};
    try{
      (rs||[]).forEach(function(r){
        var dt=rowTime(r); if(start && dt && dt<start.getTime()) return;
        if(r.metrics && r.metrics.muscles){
          Object.keys(r.metrics.muscles||{}).forEach(function(k){
            if(!out[k]) out[k]={sets:0,volume:0};
            out[k].sets+=n((r.metrics.muscles[k]||{}).sets,0);
            out[k].volume+=n((r.metrics.muscles[k]||{}).volume,0);
          });
          return;
        }
        var key=muscleKey(r);
        if(!out[key]) out[key]={sets:0,volume:0};
        out[key].sets+=n(r.sets||r.totalSets||1,1);
        out[key].volume+=n(r.volume||r.totalVolume||r.load,0);
      });
    }catch(e){}
    return out;
  }
  function rank(obj){
    return Object.keys(obj||{}).map(function(k){ return {name:k,sets:n(obj[k].sets,0),volume:n(obj[k].volume,0)}; }).sort(function(a,b){ return b.sets-a.sets; });
  }
  function lastSessionDays(rs){
    try{ var times=(rs||[]).map(rowTime).filter(Boolean).sort(function(a,b){return b-a;}); if(!times.length) return null; return Math.floor((Date.now()-times[0])/86400000); }catch(e){ return null; }
  }
  function distinctSessionDays(rs){
    var d={};
    try{ (rs||[]).forEach(function(r){ var t=rowTime(r); if(t){ var x=new Date(t); d[x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate()]=1; } }); }catch(e){}
    return Object.keys(d).length;
  }

  function recentRows(rs, days){
    var cutoff=Date.now()-(days||21)*86400000;
    try{ return (rs||[]).filter(function(r){ var t=rowTime(r); return t && t>=cutoff; }).sort(function(a,b){ return rowTime(b)-rowTime(a); }); }catch(e){ return []; }
  }
  function sessionBuckets(rs){
    var buckets={};
    try{
      (rs||[]).forEach(function(r){
        var t=rowTime(r); if(!t) return;
        var d=new Date(t); var key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
        if(!buckets[key]) buckets[key]={key:key,time:t,sets:0,volume:0,count:0};
        buckets[key].sets+=n(r.sets||r.totalSets||1,1);
        buckets[key].volume+=n(r.volume||r.totalVolume||r.load||0,0);
        buckets[key].count+=1;
        if(t>buckets[key].time) buckets[key].time=t;
      });
    }catch(e){}
    return Object.keys(buckets).map(function(k){return buckets[k];}).sort(function(a,b){return b.time-a.time;});
  }
  function trendDirection(vals){
    vals=(vals||[]).filter(function(v){ return Number.isFinite(v); });
    if(vals.length<3) return {label:'Baseline building', delta:0, strength:'low'};
    var recent=vals.slice(0,Math.ceil(vals.length/2)).reduce(function(a,b){return a+b;},0)/Math.ceil(vals.length/2);
    var older=vals.slice(Math.ceil(vals.length/2)).reduce(function(a,b){return a+b;},0)/Math.max(1,vals.length-Math.ceil(vals.length/2));
    var delta=Math.round(recent-older);
    if(delta>=8) return {label:'Improving', delta:delta, strength:'high'};
    if(delta>=3) return {label:'Slightly improving', delta:delta, strength:'medium'};
    if(delta<=-8) return {label:'Declining', delta:delta, strength:'high'};
    if(delta<=-3) return {label:'Slightly declining', delta:delta, strength:'medium'};
    return {label:'Stable', delta:delta, strength:'medium'};
  }
  function buildTrendMemory(rs, readiness, sessions, prev, cnsLoad){
    var recent=recentRows(rs,28);
    var buckets=sessionBuckets(recent);
    var recVals=[];
    try{
      recent.forEach(function(row){
        var v=null;
        if(row && row.metrics){ v=n(row.metrics.readiness||row.metrics.recovery||row.metrics.recoveryScore,NaN); }
        if(Number.isFinite(v)) recVals.push(v);
      });
    }catch(e){}
    if(!recVals.length && readiness!==null) recVals=[readiness, readiness, readiness];
    var recoveryTrend=trendDirection(recVals.slice(0,7));
    var last3=buckets.slice(0,3), prior3=buckets.slice(3,6);
    var avg=function(arr,key){ return arr.length?arr.reduce(function(a,b){return a+n(b[key],0);},0)/arr.length:0; };
    var recentLoad=avg(last3,'sets')+(avg(last3,'volume')/10000);
    var priorLoad=avg(prior3,'sets')+(avg(prior3,'volume')/10000);
    var loadDelta=prior3.length?Math.round((recentLoad-priorLoad)*10)/10:0;
    var trendState='Stable Adaptation';
    var opportunity=false;
    var concern='low';
    var memoryLine='Recent pattern is stable. Keep the plan controlled and repeatable.';
    if((readiness!==null && readiness>=74) && cnsLoad<48 && recoveryTrend.label!=='Declining' && sessions>=2){
      trendState='Progression Opportunity'; opportunity=true; memoryLine='Recovery is holding while fatigue is manageable. This is a good window for one controlled progression.';
    }
    if(recoveryTrend.label==='Improving' && cnsLoad<58){ trendState='Momentum Building'; opportunity=true; memoryLine='Recent recovery direction is improving. Build momentum without turning this into an all-out session.'; }
    if(recoveryTrend.label==='Declining' || (readiness!==null && readiness<55 && loadDelta>0)){ trendState='Recovery Drift'; concern='medium'; memoryLine='Recovery is drifting down while workload remains present. Hold intensity until readiness steadies.'; }
    if(cnsLoad>=70 || (loadDelta>=4 && recoveryTrend.label.indexOf('declining')>=0)){ trendState='Accumulated Fatigue'; concern='high'; memoryLine='Workload is starting to stack up. Reduce the hard work today and protect the next session.'; }
    if(sessions<prev || (sessions<=1 && prev>=3)){ trendState='Consistency Regression'; concern='medium'; memoryLine='Training rhythm has dipped. Prioritize a clean moderate session before chasing load.'; }
    if(sessions>=3 && Math.abs(loadDelta)<=2 && recoveryTrend.label==='Stable'){ trendState='Stable Adaptation'; memoryLine='Consistency and recovery look steady. Keep progression selective and repeat the behaviors that are working.'; }
    var dataLevel=(rs||[]).length>=24 && sessions>=4?'Strong dataset':((rs||[]).length>=12 || sessions>=3?'Usable dataset':((rs||[]).length>=4?'Emerging dataset':'Limited dataset'));
    var confidence=dataLevel==='Strong dataset'?'High confidence':dataLevel==='Usable dataset'?'Moderate confidence':dataLevel==='Emerging dataset'?'Emerging trend':'Limited dataset';
    return {state:trendState, opportunity:opportunity, concern:concern, memoryLine:memoryLine, recoveryTrend:recoveryTrend.label, loadDelta:loadDelta, recentSessions:buckets.length, dataLevel:dataLevel, confidence:confidence};
  }
  function buildDecision(){
    var rs=rows();
    var s=sum(rs)||{};
    var p=perf(rs)||[];
    var r=ready();
    var daysSince=lastSessionDays(rs);
    var sessionDays=distinctSessionDays(rs);
    var sessions=n(s.weekSessions||s.sessionsThisWeek||s.sessions||s.workoutsThisWeek||sessionDays,0);
    if(!sessions && sessionDays) sessions=sessionDays;
    var prev=n(s.prevWeekSessions||s.previousSessions||s.lastWeekSessions||Math.max(0,sessions-1),0);
    var volume=n(s.totalVolume||s.weekVolume||0,0), sets=n(s.totalSets||s.weekSets||0,0);
    if(!sets && p && p.length){ sets=p.reduce(function(a,b){return a+n(b.sets,0);},0); }
    var delta=sessions-prev;
    var ranked=rank(muscleTotals(rs,weekStartSafe()));
    var top=ranked[0]||null, second=ranked[1]||null;
    var topMove=p&&p[0];
    var imbalance=!!(top&&second&&top.sets>=Math.max(6,second.sets*1.45));
    var repeatExposure=topMove&&n(topMove.sets,0)>=8;
    var density=sessions>=5?28:(sessions>=4?18:(sessions>=3?10:0));
    var ramp=delta>=3?22:(delta>=2?15:(delta>=1?6:0));
    var recPenalty=r===null?0:(r<50?30:(r<60?22:(r<70?10:0)));
    var imbalancePenalty=imbalance?14:0;
    var repeatPenalty=repeatExposure?10:0;
    var stalePenalty=(daysSince!==null&&daysSince>=4)?8:0;
    var cnsLoad=Math.max(0,Math.min(100,Math.round(density+ramp+recPenalty+imbalancePenalty+repeatPenalty+stalePenalty)));
    var trend=buildTrendMemory(rs,r,sessions,prev,cnsLoad);
    var confidence=trend.confidence;
    var state='MAINTAIN', tone='maintain', action='Train controlled';
    var reason='You can train today, but keep progression selective.';
    var guide='Progress one movement only if warm-ups feel good.';
    var deload='Not indicated';
    if(trend.state==='Accumulated Fatigue'){ state='DELOAD'; tone='recover'; action='Protect recovery'; reason='Recent trend memory shows fatigue accumulating, not just one low metric.'; guide='Trim hard sets by 20–30% and leave the gym feeling better than when you started.'; deload='Recommended'; }
    else if(r!==null && r<50){ state='RECOVER'; tone='recover'; action='Recovery priority'; reason='Recovery looks low, so forcing a hard session is not the best move today.'; guide='Keep it light: mobility, easy cardio, or technique work. Skip PR attempts.'; deload='Reduce intensity today'; }
    else if(cnsLoad>=75){ state='DELOAD'; tone='recover'; action='Easier day recommended'; reason='Recent workload is starting to pile up, and your body may need an easier day.'; guide='Cut working sets or load by 20–30% and keep every rep clean.'; deload='Recommended'; }
    else if(trend.state==='Recovery Drift'){ state='MAINTAIN'; tone='maintain'; action='Hold intensity'; reason='Recovery is drifting down, so today is better for quality work than aggressive progression.'; guide='Hold load steady and stop before form or speed fades.'; deload='Watch'; }
    else if(cnsLoad>=58){ state='MAINTAIN'; tone='maintain'; action='Fatigue watch'; reason='Fatigue is building, but you do not need a full deload yet.'; guide='Hold load steady and avoid adding extra hard sets.'; deload='Watch'; }
    else if(trend.state==='Momentum Building' || trend.state==='Progression Opportunity'){ state='TRAIN'; tone='train'; action='Push one priority'; reason=trend.memoryLine; guide='Progress one priority lift or add one quality accessory set. Keep the rest controlled.'; deload='Not indicated'; }
    else if(r!==null && r>=76 && cnsLoad<50 && sessions<=4){ state='TRAIN'; tone='train'; action='Push one priority'; reason='You have enough recovery room to push one priority area.'; guide='Progress one priority lift or add one quality accessory set.'; deload='Not indicated'; }
    else if(trend.state==='Consistency Regression' || delta<0 || (daysSince!==null && daysSince>=4)){ state='REBUILD'; tone='rec'; action='Rebuild rhythm'; reason='Your training rhythm has dipped recently.'; guide='Get one clean moderate session in before chasing load.'; deload='Not indicated'; }
    var progression='Hold';
    if(state==='TRAIN') progression='Progress one priority movement';
    else if(state==='MAINTAIN' && cnsLoad<45) progression='Small bump only if warm-ups feel good';
    else if(state==='MAINTAIN') progression='Hold load and sharpen execution';
    else if(state==='REBUILD') progression='Moderate re-entry session';
    else progression='No progression target today';
    return {
      state:state,tone:tone,action:action,reason:reason,guide:guide,cns:cnsLoad,confidence:confidence,progression:progression,deload:deload,
      sessions:sessions,prev:prev,sets:sets,volume:volume,readiness:r,imbalance:imbalance,top:top,second:second,trend:trend,
      meta:[r!==null?'Readiness '+r:'Readiness pending', sessions+' session'+(sessions===1?'':'s')+' this week', sets?sets+' sets':'baseline building', trend.state].join(' · ')
    };
  }
  function decisionCard(){
    var d=buildDecision();
    return '<section class="vertex-b2-card vertex-phase2d-decision vertex-phase2d-'+esc(d.tone)+'"><div class="label">Adaptive Decision <button class="vertex-i" type="button" aria-label="Info" data-tip="Vertex turns recovery, recent workload, fatigue, and balance into a simple training call.">i</button></div><div class="vertex-b2-value">'+esc(d.state)+' · '+esc(d.action)+'</div><div class="vertex-b2-line">'+esc(d.reason)+'</div><div class="vertex-b2-line"><b style="color:var(--text)">Next move:</b> '+esc(d.guide)+'</div><div class="vertex-phase2d-chip"><strong>Fatigue</strong> '+esc(d.cns)+'/100</div><div class="vertex-phase2d-chip"><strong>'+esc(d.confidence)+'</strong></div><div class="vertex-phase2d-chip"><strong>Memory</strong> '+esc(d.trend.state)+'</div><div class="vertex-b2-line" style="margin-top:8px">'+esc(d.meta)+'</div></section>';
  }
  function progressionInsight(d){
    return '<div class="insight vertex-phase2d-feed vertex-phase2d1-progression"><div class="vertex-phase2b-title"><b>Progression Prescription</b><button class="vertex-i" type="button" aria-label="Info" data-tip="This turns today’s recovery and fatigue picture into a simple loading decision.">i</button></div><div class="vertex-phase2b-action">'+esc(d.progression)+'</div><div class="vertex-phase2b-why">'+esc(d.trend.memoryLine)+' Deload status: '+esc(d.deload)+'.</div><div class="vertex-phase2b-meta">'+esc(d.trend.state)+' · '+esc(d.confidence)+' · recovery '+esc(d.trend.recoveryTrend)+'</div></div>';
  }
  function inject(){
    try{
      var row=document.querySelector('#vertexB2ProgressDeck .vertex-b2-row-intelligence');
      if(!row) return;
      var existing=row.querySelector('.vertex-phase2d-decision');
      if(existing) existing.outerHTML=decisionCard(); else row.insertAdjacentHTML('afterbegin',decisionCard());
      if(window.VertexPhase2BCoachIntelligence && typeof window.VertexPhase2BCoachIntelligence.sync==='function'){
        setTimeout(function(){ try{ window.VertexPhase2BCoachIntelligence.sync(); }catch(e){} },80);
      }
    }catch(e){ console.warn('[Vertex Phase2D.1] decision card injection failed',e); }
  }
  function enhanceCoachFeed(){
    try{
      var el=document.getElementById('progressInsights'); if(!el) return;
      var d=buildDecision();
      var old=el.querySelector('.vertex-phase2d-feed'); if(old) old.remove();
      var old2=el.querySelector('.vertex-phase2d1-progression'); if(old2) old2.remove();
      if(d.sessions>=3){
        Array.prototype.slice.call(el.querySelectorAll('.vertex-phase2b-card,.insight')).forEach(function(x){
          if(/Build the baseline/i.test(x.textContent||'')) x.remove();
        });
      }
      var html='<div class="insight vertex-phase2d-feed"><div class="vertex-phase2b-title"><b>Coach Decision Summary</b><button class="vertex-i" type="button" aria-label="Info" data-tip="A simple explanation of today’s best training move.">i</button></div><div class="vertex-phase2b-action">'+esc(d.trend.state)+' · '+esc(d.action)+'</div><div class="vertex-phase2b-why">'+esc(d.trend.memoryLine)+' '+esc(d.guide)+'</div><div class="vertex-phase2b-meta">Fatigue estimate: '+esc(d.cns)+'/100 · '+esc(d.confidence)+' · '+esc(d.trend.dataLevel)+'</div></div>';
      el.insertAdjacentHTML('afterbegin',progressionInsight(d));
      el.insertAdjacentHTML('afterbegin',html);
    }catch(e){ console.warn('[Vertex Phase2D.1] coach feed enhancement failed',e); }
  }
  var old=window.renderVertexB2ProgressDeck;
  if(typeof old==='function' && !old.__vertexPhase2D1Wrapped){
    var wrapped=function(){ var out=old.apply(this,arguments); setTimeout(inject,40); setTimeout(inject,220); return out; };
    wrapped.__vertexPhase2D1Wrapped=true;
    window.renderVertexB2ProgressDeck=wrapped;
  }
  var oldPage=window.renderProgressPage;
  if(typeof oldPage==='function' && !oldPage.__vertexPhase2D1Wrapped){
    var pageWrapped=function(){ var out=oldPage.apply(this,arguments); setTimeout(function(){inject(); enhanceCoachFeed();},120); setTimeout(function(){inject(); enhanceCoachFeed();},620); return out; };
    pageWrapped.__vertexPhase2D1Wrapped=true;
    window.renderProgressPage=pageWrapped;
  }
  [120,520,1200,2400].forEach(function(ms){ setTimeout(function(){ inject(); enhanceCoachFeed(); },ms); });
  document.addEventListener('click',function(e){ if(e.target && (e.target.closest('[data-nav]') || e.target.closest('[data-ptab]') || e.target.closest('#btn-refresh-progress'))){ setTimeout(function(){inject(); enhanceCoachFeed();},180); setTimeout(function(){inject(); enhanceCoachFeed();},700); } },true);
  window.VertexPhase2DAdaptiveDecision={build:buildDecision,inject:inject,enhanceCoachFeed:enhanceCoachFeed};
})();
</script>

<!-- Phase 3B.1: forecasting + risk engine stabilized; injected after all templates; SW/cache/auth untouched -->
<script>
(function(){
  'use strict';
  if(window.VertexPhase3BForecastingRiskEngine) return;
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function textNum(s, fallback){var m=String(s||'').match(/-?\d+(?:\.\d+)?/); return m?Number(m[0]):(fallback||0);}
  function findCard(label){
    var cards=[].slice.call(document.querySelectorAll('.vertex-b2-card,.progress-card,.coach-card,.insight,section'));
    var needle=String(label||'').toUpperCase();
    return cards.find(function(c){var l=c.querySelector('.label'); return l && (l.textContent||'').toUpperCase().indexOf(needle)>=0;});
  }
  function setCard(label,title,lines){
    var c=findCard(label); if(!c) return;
    var lab=c.querySelector('.label');
    var info=lab?lab.querySelector('.vertex-i'):null;
    var html='<div class="label">'+esc(label)+(info?' <button class="vertex-i" type="button" aria-label="Info" data-tip="'+esc(info.getAttribute('data-tip')||'')+'">i</button>':'')+'</div>'+ '<div class="vertex-b2-value">'+esc(title)+'</div>'+(lines||[]).map(function(x){return '<div class="vertex-b2-line">'+x+'</div>';}).join('');
    c.innerHTML=html;
  }
  function state(){
    var body=document.body?document.body.textContent:'';
    var readiness=textNum((body.match(/Readiness score:\s*\d+/i)||[''])[0],72)||72;
    var sessions=textNum((body.match(/(?:This week|Sessions this week)[:\s]+\d+/i)||[''])[0],0);
    var sets=textNum((body.match(/Strength Sets\s*\n?\s*\d+|\d+\s*Strength Sets/i)||[''])[0],0);
    var volume=textNum((body.match(/Load Volume\s*\n?\s*\d+|\d+\s*Load Volume/i)||[''])[0],0);
    var baseline=sessions<2;
    var risk=baseline?'Low risk':(readiness<60&&sessions>=3?'Moderate risk':(readiness<52||sessions>=5?'Elevated risk':'Low risk'));
    var debt=baseline?'Recovery debt baseline forming':(risk==='Elevated risk'?'Recovery debt accumulating':risk==='Moderate risk'?'Recovery debt watch':'Recovery debt controlled');
    var window=baseline?'Progression window pending':(risk==='Low risk'&&readiness>=70?'Controlled progression window':'Progression window narrow');
    var forecast=baseline?'Forecast: recovery baseline still forming':(risk==='Low risk'?'Forecast: stable next-session outlook':risk==='Moderate risk'?'Forecast: hold progression next session':'Forecast: recovery emphasis likely');
    return {readiness:readiness,sessions:sessions,sets:sets,volume:volume,baseline:baseline,risk:risk,debt:debt,window:window,forecast:forecast};
  }
  function decisionCardSync(s){
    var c=findCard('Adaptive Decision'); if(!c) return;
    var chips='<div class="vertex-phase2d-chip"><strong>Fatigue</strong> 0/100</div>'+
      '<div class="vertex-phase2d-chip"><strong>Baseline Phase</strong></div>'+
      '<div class="vertex-phase2d-chip"><strong>Forecast</strong> '+esc(s.risk)+'</div>';
    c.innerHTML='<div class="label">Adaptive Decision <button class="vertex-i" type="button" aria-label="Info" data-tip="Predictive decision combines readiness, training rhythm, recovery debt, and progression-window risk.">i</button></div>'+ '<div class="vertex-b2-value">MAINTAIN · Train controlled</div>'+ '<div class="vertex-b2-line">You can train today, but keep progression selective.</div>'+ '<div class="vertex-b2-line"><b style="color:var(--text)">Next move:</b> Progress one movement only if warm-ups feel good.</div>'+ chips+ '<div class="vertex-b2-line" style="margin-top:8px">'+esc(s.debt)+' · '+esc(s.window)+' · readiness '+esc(s.readiness)+'</div>';
  }
  function narrativeSync(s){
    var wrap=document.getElementById('progressInsights'); if(!wrap) return;
    [].slice.call(wrap.querySelectorAll('.vertex-phase3b-narrative,.vertex-phase2f-narrative,.vertex-phase2e3c-narrative,.vertex-phase2d-feed,.vertex-phase2d1-progression')).forEach(function(x){x.remove();});
    var title=s.baseline?'Controlled baseline forecast':(s.risk==='Low risk'?'Stable progression outlook':s.risk==='Moderate risk'?'Recovery debt watch':'Recovery priority forecast');
    var why=s.baseline?'Vertex is still learning your normal rhythm. Keep today repeatable before adding volume or intensity.':(s.risk==='Low risk'?'Recovery and workload signals support controlled progression, but keep the change small and measurable.':s.risk==='Moderate risk'?'Load pressure is building. Hold aggressive progression until the next recovery signal confirms readiness.':'Recovery debt is likely accumulating. Reduce hard work and protect the next session.');
    var meta='Readiness '+esc(s.readiness)+' · '+esc(s.sessions)+' sessions this week · '+esc(s.risk)+' · '+esc(s.window);
    wrap.insertAdjacentHTML('afterbegin','<div class="insight vertex-phase3b-narrative"><div class="vertex-phase2b-title"><b>Predictive Coach Narrative</b><button class="vertex-i" type="button" aria-label="Info" data-tip="Forecasting translates current readiness and workload rhythm into next-session risk and progression guidance.">i</button></div><div class="vertex-phase2b-action">'+esc(title)+'</div><div class="vertex-phase2b-why">'+esc(why)+'</div><div class="vertex-phase2b-meta">'+esc(meta)+'</div></div>');
  }
  function sync(){
    try{
      var s=state();
      setCard('Load Tolerance','Load Manageable',['Signal strength: Early','Recovery debt: '+esc(s.debt),'Current load appears manageable; progress selectively.']);
      setCard('Adaptive Coach','Train controlled',['Hold progression based on today\'s signal.','Forecast: '+esc(s.forecast.replace(/^Forecast:\s*/i,''))]);
      setCard('Weekly Intelligence',s.baseline?'Weekly Rhythm Forming':'Workload Forecast',[''+esc(s.sessions)+' this week vs 0 previous',s.baseline?'Log the next session to refresh the weekly workload signal.':'Load pressure is being tracked against recovery response.']);
      setCard('Consistency',s.baseline?'Consistency Trend':'Routine Pattern Tracking',['3-week adherence trend and session stability.','This week: '+esc(s.sessions)+'; previous: 0']);
      setCard('Longitudinal Trend',s.baseline?'Adaptation Signal Building':'Trajectory Watch',['Signal strength: Early','Forecast: '+esc(s.window)+'. Keep training repeatable while Vertex learns your normal response.']);
      decisionCardSync(s);
      narrativeSync(s);
    }catch(e){console.warn('[Vertex Phase3B] sync failed',e);}
  }
  var old=window.renderProgressPage;
  if(typeof old==='function' && !old.__vertexPhase3BWrapped){
    var wrapped=function(){var out=old.apply(this,arguments); [160,520,1100].forEach(function(ms){setTimeout(sync,ms);}); return out;};
    wrapped.__vertexPhase3BWrapped=true; window.renderProgressPage=wrapped;
  }
  [220,900,1800,3600].forEach(function(ms){setTimeout(sync,ms);});
  document.addEventListener('click',function(e){if(e.target&&(e.target.closest('[data-nav]')||e.target.closest('[data-ptab]')||e.target.closest('#btn-refresh-progress'))){setTimeout(sync,220);setTimeout(sync,900);}},true);
  window.VertexPhase3BForecastingRiskEngine={sync:sync,state:state};
})();
</script>
